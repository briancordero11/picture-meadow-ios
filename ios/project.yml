name: WishExplorer
options:
  bundleIdPrefix: com.wishexplorer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    WISH_API_BASE_URL: ""
    WISH_ONLINE_PREVIEW_ENABLED: "NO"
    WISH_PUBLISHER_NAME: ""
    WISH_SUPPORT_EMAIL: ""
    WISH_PRIVACY_POLICY_URL: ""
    WISH_SUPPORT_URL: ""
targets:
  WishExplorer:
    type: application
    platform: iOS
    sources:
      - path: WishExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wishexplorer.prototype
        INFOPLIST_FILE: WishExplorer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - WishExplorerTests
  WishExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WishExplorerTests
    dependencies:
      - target: WishExplorer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
